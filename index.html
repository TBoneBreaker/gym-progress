<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7f2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Gym Progress"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>Gym Progress</title><style>
:root{--bg:#f5f7f2;--card:#fff;--text:#172219;--muted:#7c887f;--line:#e1e8df;--green:#63db78;--green2:#2e8f43;--soft:#eef9f0;--danger:#d45d5d}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(#fafcf9,#f1f5ef);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Segoe UI,Roboto,Arial,sans-serif;min-height:100dvh}.app{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 16px calc(92px + env(safe-area-inset-bottom))}header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:18px 4px 14px;background:linear-gradient(rgba(250,252,249,.96),rgba(250,252,249,.82),transparent);backdrop-filter:blur(14px)}header small{display:block;font-size:11px;letter-spacing:.16em;color:#8a968d;font-weight:800}h1{margin:4px 0 0;font-size:29px;letter-spacing:-.045em}.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 34px rgba(38,65,44,.07)}.section{display:flex;justify-content:space-between;align-items:end;margin:24px 3px 10px}.section h2{margin:0;font-size:18px}.section span{font-size:12px;color:var(--muted)}button,input,select{font:inherit}.gear,.ghost,.primary,.day,.step{border:0;cursor:pointer;transition:transform .12s ease}.gear:active,.ghost:active,.primary:active,.day:active,.step:active{transform:scale(.96)}.gear{width:44px;height:44px;border-radius:15px;background:#fff;border:1px solid var(--line);font-size:23px}.weightHero{padding:18px}.big{font-size:36px;font-weight:820;letter-spacing:-.05em}.big small{font-size:15px;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:var(--muted);font-size:12px}.exerciseGrid{display:grid;gap:11px}.exercise{padding:16px}.exercise b{font-size:18px}.exercise .meta{margin-top:12px;display:flex;justify-content:space-between;gap:10px}.exercise .meta span{font-size:12px;color:var(--muted)}.exercise .meta strong{display:block;color:var(--text);font-size:15px;margin-top:2px}.views>.view{display:none}.views>.view.active{display:block}.dayGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.day{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;text-align:left}.day.active{background:var(--soft);border-color:#9bdca6}.day b{display:block;font-size:18px}.day small{color:var(--muted)}.workoutHead{padding:16px;margin-top:12px}.workout{padding:16px;margin-top:10px}.workout h3{margin:0 0 4px;font-size:18px}.set{display:grid;grid-template-columns:30px 1fr 1fr;gap:8px;align-items:end;padding:8px 0;border-top:1px solid #edf1ec}.set:first-of-type{border-top:0}.n{height:44px;display:grid;place-items:center;color:var(--muted);font-size:12px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.inputStep{display:grid;grid-template-columns:1fr auto;gap:6px}.inputStep input,input,select{width:100%;border:1px solid #dfe7df;background:#fff;border-radius:13px;padding:11px 10px;outline:none}.step{border:1px solid #cfe7d2;background:var(--soft);color:var(--green2);border-radius:11px;padding:0 9px;font-size:11px;font-weight:800}.saved{font-size:11px;color:var(--green2);margin:12px 2px;text-align:center}.primary{width:100%;background:var(--green);color:#14331a;border-radius:16px;padding:14px;font-weight:820;margin-top:12px}.ghost{background:#f3f6f2;border:1px solid var(--line);border-radius:11px;padding:8px 10px;color:#68746b}.danger{color:var(--danger)}.history{padding:10px 14px}.hist{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid #edf1ec}.hist:first-child{border-top:0}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(730px,calc(100% - 24px));height:68px;background:rgba(255,255,255,.94);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:24px;display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 12px 34px rgba(38,65,44,.12);z-index:10}.nav button{border:0;background:transparent;color:#8a958d;font-size:12px;font-weight:760}.nav button.active{color:var(--green2)}.modal{position:fixed;inset:0;background:rgba(28,39,31,.28);backdrop-filter:blur(8px);display:none;align-items:flex-end;z-index:50}.modal.open{display:flex}.sheet{width:min(760px,100%);max-height:92dvh;overflow:auto;background:#fbfdfb;border-radius:28px 28px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}.sheet h3{margin:0 0 14px;font-size:22px}.planDay{padding:14px;margin-top:10px}.planRow{display:grid;grid-template-columns:1fr 75px 42px;gap:7px;margin-top:7px}.tiny{font-size:11px;color:var(--muted)}@media(min-width:620px){.exerciseGrid{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><header><div><small>TRAINING TRACKER</small><h1 id="title">Progress</h1></div><button class="gear" id="settings">⚙</button></header><div class="views">
<section id="home" class="view active"><div class="section"><h2>Körpergewicht</h2><span>Morgens nüchtern</span></div><div class="card weightHero" id="goWeight"><div class="row"><div><div class="big" id="homeWeight">– <small>kg</small></div><div class="muted">Letzter Eintrag</div></div><div class="muted" style="text-align:right">Veränderung / Woche<br><strong id="homeWeek" style="color:var(--text);font-size:15px">–</strong></div></div></div><div class="section"><h2>Übungen</h2><span id="exCount"></span></div><div id="exerciseGrid" class="exerciseGrid"></div></section>
<section id="training" class="view"><div class="section"><h2>Training auswählen</h2><button class="ghost" id="editPlan">Plan bearbeiten</button></div><div id="trainingRoot"></div></section>
<section id="weight" class="view"><div class="card weightHero"><div class="row"><div><div class="big" id="weightNow">– <small>kg</small></div><div class="muted">Letzter Eintrag</div></div><button class="gear" id="addWeight">＋</button></div><div class="muted" style="margin-top:10px">7-Tage-Schnitt: <strong id="avg7">–</strong> · Woche: <strong id="weekChange">–</strong></div></div><div class="section"><h2>Einträge</h2><span>Neueste zuerst</span></div><div class="card history" id="weightHistory"></div></section>
</div></div><nav class="nav"><button data-v="home" class="active">Übersicht</button><button data-v="training">Übungen</button><button data-v="weight">Gewicht</button></nav>
<div class="modal" id="planModal"><div class="sheet"><h3>Trainingsplan</h3><label>Split-Tage</label><select id="splitCount"></select><div id="planEditor"></div><button class="primary" id="savePlan">Trainingsplan speichern</button><button class="ghost" data-close="planModal" style="width:100%;margin-top:8px">Abbrechen</button></div></div>
<div class="modal" id="weightModal"><div class="sheet"><h3>Gewicht eintragen</h3><label>Datum</label><input type="date" id="weightDate"><label>Gewicht (kg)</label><input type="number" step="0.1" inputmode="decimal" id="weightInput"><button class="primary" id="saveWeight">Speichern</button><button class="ghost" data-close="weightModal" style="width:100%;margin-top:8px">Abbrechen</button></div></div>
<div class="modal" id="settingsModal"><div class="sheet"><h3>Einstellungen</h3><button class="primary" id="settingsPlan">Trainingsplan bearbeiten</button><button class="ghost" id="exportBtn" style="width:100%;margin-top:8px">Backup exportieren</button><button class="ghost" data-close="settingsModal" style="width:100%;margin-top:8px">Schließen</button></div></div>
<script>(()=>{"use strict";const KEY="gymProgressPWA_v1",DRAFT="gymProgressPWA_workoutDraft_v2";const $=x=>document.getElementById(x),today=()=>new Date().toISOString().slice(0,10),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),fmt=n=>Number.isFinite(n)?n.toLocaleString("de-DE",{maximumFractionDigits:2}):"–";let data;try{data=JSON.parse(localStorage.getItem(KEY))||{version:5,exercises:[],weights:[],plan:{days:[]}}}catch{data={version:5,exercises:[],weights:[],plan:{days:[]}}}data.exercises||=[];data.weights||=[];data.plan||={days:[]};data.plan.days||=[];data.exercises.forEach(e=>e.sessions||=[]);let drafts;try{drafts=JSON.parse(localStorage.getItem(DRAFT))||{}}catch{drafts={}}let selected=data.plan.days[0]?.id||null,workDate=today(),planDraft=[];const save=()=>localStorage.setItem(KEY,JSON.stringify(data)),saveDraft=()=>localStorage.setItem(DRAFT,JSON.stringify(drafts)),ex=id=>data.exercises.find(e=>e.id===id),open=id=>$(id).classList.add("open"),close=id=>$(id).classList.remove("open");document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>close(b.dataset.close));document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>show(b.dataset.v));function show(v){document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active",x.id===v));document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.v===v));$("title").textContent=v==="training"?"Übungen":v==="weight"?"Körpergewicht":"Progress";render()}
function weightStats(){const w=[...data.weights].sort((a,b)=>a.date.localeCompare(b.date));if(!w.length)return{};const last=w.at(-1).value;const last7=w.slice(-7).map(x=>+x.value),avg=last7.reduce((a,b)=>a+b,0)/last7.length;let week=null;if(w.length>=8){const prev=w.slice(-14,-7).map(x=>+x.value);if(prev.length)week=avg-prev.reduce((a,b)=>a+b,0)/prev.length}return{w,last,avg,week}}
function renderHome(){const s=weightStats();$("homeWeight").innerHTML=(s.last!=null?fmt(s.last):"–")+' <small>kg</small>';$("homeWeek").textContent=s.week==null?"–":`${s.week>=0?"+":""}${fmt(s.week)} kg`;const shown=[...new Set(data.plan.days.flatMap(d=>(d.items||[]).map(i=>i.exerciseId)))].map(ex).filter(Boolean);$("exCount").textContent=`${shown.length} Übungen`;$("exerciseGrid").innerHTML=shown.length?shown.map(e=>{const ss=[...e.sessions].sort((a,b)=>a.date.localeCompare(b.date)),last=ss.at(-1),best=last?.sets?.reduce((m,x)=>!m||+x.weight>+m.weight?x:m,null);return `<div class="card exercise"><b>${e.name}</b><div class="meta"><span>Letzter Top-Satz<strong>${best?`${fmt(+best.weight)} kg × ${best.reps}`:"Noch kein Training"}</strong></span><span>${ss.length} Trainings</span></div></div>`}).join(""):'<div class="card exercise">Noch keine Übungen im Trainingsplan.</div>'}
function source(e,day,count){const key=`${day.id}__${workDate}`,d=(drafts[key]?.[e.id]||[]),cur=e.sessions.find(s=>s.date===workDate&&s.planDayId===day.id),prior=[...e.sessions].filter(s=>s.date<workDate).sort((a,b)=>a.date.localeCompare(b.date)).at(-1);return Array.from({length:count},(_,i)=>({weight:d[i]?.weight??cur?.sets?.[i]?.weight??prior?.sets?.[i]?.weight??"",reps:d[i]?.reps??cur?.sets?.[i]?.reps??prior?.sets?.[i]?.reps??"",touched:!!d[i]?.touched||!!cur?.sets?.[i]}))}
function renderTraining(){const root=$("trainingRoot");if(!data.plan.days.length){root.innerHTML='<div class="card exercise">Noch kein Trainingsplan.<button class="primary" id="mkPlan">Plan einrichten</button></div>';$("mkPlan").onclick=editPlan;return}if(!selected||!data.plan.days.some(d=>d.id===selected))selected=data.plan.days[0].id;const day=data.plan.days.find(d=>d.id===selected);root.innerHTML=`<div class="dayGrid">${data.plan.days.map(d=>`<button class="day ${d.id===selected?"active":""}" data-day="${d.id}"><b>${d.name}</b><small>${(d.items||[]).length} Übungen</small></button>`).join("")}</div><div class="card workoutHead"><div class="row"><div><div class="muted">Heutiges Training</div><b style="font-size:22px">${day.name}</b></div><input type="date" id="workDate" value="${workDate}" style="width:145px"></div></div>${(day.items||[]).map((it,ix)=>{const e=ex(it.exerciseId);if(!e)return"";const vals=source(e,day,+it.sets||1);return `<div class="card workout"><h3>${ix+1}. ${e.name}</h3><div class="muted">${it.sets} Sätze</div>${vals.map((v,i)=>`<div class="set" data-row data-ex="${e.id}" data-i="${i}" data-touch="${v.touched?1:0}"><div class="n">${i+1}</div><div class="field"><label>kg</label><div class="inputStep"><input class="kg" type="number" step="0.5" inputmode="decimal" value="${v.weight}"><button class="step" data-kg>+0,5</button></div></div><div class="field"><label>Wdh.</label><div class="inputStep"><input class="reps" type="number" step="1" inputmode="numeric" value="${v.reps}"><button class="step" data-reps>+1</button></div></div></div>`).join("")}</div>`}).join("")}<div class="saved" id="savedText">Speichert automatisch</div>`;root.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{selected=b.dataset.day;workDate=today();renderTraining()});$("workDate").onchange=e=>{autoSave();workDate=e.target.value||today();renderTraining()};root.querySelectorAll("[data-row]").forEach(r=>{const touch=()=>{r.dataset.touch=1;draftRow(r);autoSave()};r.querySelectorAll("input").forEach(i=>{i.oninput=touch;i.onchange=touch;i.onfocus=touch});r.querySelector("[data-kg]").onclick=()=>{const i=r.querySelector(".kg");i.value=String(Math.round(((parseFloat(i.value)||0)+.5)*100)/100);touch()};r.querySelector("[data-reps]").onclick=()=>{const i=r.querySelector(".reps");i.value=String((parseInt(i.value)||0)+1);touch()}})}
function draftRow(r){const day=data.plan.days.find(d=>d.id===selected),key=`${day.id}__${workDate}`;drafts[key]||={};drafts[key][r.dataset.ex]||=[];drafts[key][r.dataset.ex][+r.dataset.i]={weight:r.querySelector(".kg").value,reps:r.querySelector(".reps").value,touched:true};saveDraft()}
function autoSave(){const day=data.plan.days.find(d=>d.id===selected);if(!day)return;let n=0;(day.items||[]).forEach(it=>{const e=ex(it.exerciseId);if(!e)return;const rows=[...document.querySelectorAll(`[data-row][data-ex="${CSS.escape(e.id)}"]`)];const sets=rows.filter(r=>r.dataset.touch==="1").map(r=>({weight:parseFloat(r.querySelector(".kg").value),reps:parseInt(r.querySelector(".reps").value),planIndex:+r.dataset.i})).filter(x=>Number.isFinite(x.weight)&&x.weight>0&&Number.isFinite(x.reps)&&x.reps>0);let s=e.sessions.find(x=>x.date===workDate&&x.planDayId===day.id);if(sets.length){if(s)s.sets=sets;else e.sessions.push({id:uid(),date:workDate,sets,planDayId:day.id,workoutId:`auto_${day.id}_${workDate}`});n+=sets.length}});save();if($("savedText"))$("savedText").textContent=n?`Automatisch gespeichert · ${n} Sätze`:"Speichert automatisch"}
function renderWeight(){const s=weightStats();$("weightNow").innerHTML=(s.last!=null?fmt(s.last):"–")+' <small>kg</small>';$("avg7").textContent=s.avg!=null?`${fmt(s.avg)} kg`:"–";$("weekChange").textContent=s.week==null?"–":`${s.week>=0?"+":""}${fmt(s.week)} kg`;const h=[...(s.w||[])].reverse();$("weightHistory").innerHTML=h.length?h.map(w=>`<div class="hist"><span>${w.date}</span><b>${fmt(+w.value)} kg</b><button class="ghost danger" data-delw="${w.id}">×</button></div>`).join(""):'<div class="muted">Noch keine Einträge.</div>';document.querySelectorAll("[data-delw]").forEach(b=>b.onclick=()=>{data.weights=data.weights.filter(x=>x.id!==b.dataset.delw);save();render()})}
function editPlan(){planDraft=data.plan.days.map(d=>({id:d.id,name:d.name,items:(d.items||[]).map(i=>({exerciseId:i.exerciseId,name:ex(i.exerciseId)?.name||"",sets:i.sets}))}));if(!planDraft.length)planDraft=[{id:uid(),name:"Tag 1",items:[]}];$("splitCount").innerHTML=Array.from({length:8},(_,i)=>`<option value="${i+1}">${i+1}er Split</option>`).join("");$("splitCount").value=planDraft.length;renderPlanEditor();open("planModal")}
function renderPlanEditor(){$("planEditor").innerHTML=planDraft.map((d,di)=>`<div class="card planDay"><label>Name</label><input data-name="${di}" value="${d.name}">${d.items.map((it,ii)=>`<div class="planRow"><input data-exname="${di},${ii}" value="${it.name}" placeholder="Übung"><input data-sets="${di},${ii}" type="number" min="1" value="${it.sets}"><button class="ghost danger" data-del="${di},${ii}">×</button></div>`).join("")}<button class="ghost" data-add="${di}" style="width:100%;margin-top:8px">＋ Übung</button></div>`).join("");document.querySelectorAll("[data-name]").forEach(i=>i.oninput=()=>planDraft[+i.dataset.name].name=i.value);document.querySelectorAll("[data-exname]").forEach(i=>i.oninput=()=>{const[a,b]=i.dataset.exname.split(",").map(Number);planDraft[a].items[b].name=i.value});document.querySelectorAll("[data-sets]").forEach(i=>i.oninput=()=>{const[a,b]=i.dataset.sets.split(",").map(Number);planDraft[a].items[b].sets=Math.max(1,+i.value||1)});document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const[a,i]=b.dataset.del.split(",").map(Number);planDraft[a].items.splice(i,1);renderPlanEditor()});document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{planDraft[+b.dataset.add].items.push({exerciseId:null,name:"",sets:2});renderPlanEditor()})}
$("splitCount").onchange=()=>{const n=+$('splitCount').value;while(planDraft.length<n)planDraft.push({id:uid(),name:`Tag ${planDraft.length+1}`,items:[]});if(planDraft.length>n)planDraft=planDraft.slice(0,n);renderPlanEditor()};$("savePlan").onclick=()=>{for(const d of planDraft){d.name=d.name.trim()||"Training";for(const it of d.items){it.name=it.name.trim();if(!it.name)continue;let e=it.exerciseId?ex(it.exerciseId):data.exercises.find(x=>x.name.toLowerCase()===it.name.toLowerCase());if(!e){e={id:uid(),name:it.name,muscle:"",sessions:[]};data.exercises.push(e)}else e.name=it.name;it.exerciseId=e.id}}data.plan.days=planDraft.map(d=>({id:d.id,name:d.name,items:d.items.filter(i=>i.name&&i.exerciseId).map(i=>({exerciseId:i.exerciseId,sets:+i.sets||1}))}));selected=data.plan.days[0]?.id||null;save();close("planModal");render()};
function render(){renderHome();renderTraining();renderWeight()}$("editPlan").onclick=editPlan;$("settingsPlan").onclick=()=>{close("settingsModal");editPlan()};$("settings").onclick=()=>open("settingsModal");$("goWeight").onclick=()=>show("weight");$("addWeight").onclick=()=>{$("weightDate").value=today();$("weightInput").value="";open("weightModal")};$("saveWeight").onclick=()=>{const v=parseFloat($("weightInput").value.replace(",",".")),d=$("weightDate").value||today();if(!Number.isFinite(v))return;const old=data.weights.find(x=>x.date===d);if(old)old.value=v;else data.weights.push({id:uid(),date:d,value:v});save();close("weightModal");render()};$("exportBtn").onclick=()=>{const a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.href=u;a.download=`gym-progress-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")autoSave()});window.addEventListener("pagehide",autoSave);render();if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));})();</script></body></html>
